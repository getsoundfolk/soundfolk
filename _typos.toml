# typos (https://github.com/crate-ci/typos): spelling mistakes in code and docs.
# Run locally: typos   (fix in place: typos -w)

[files]
# Station lists measured from the outside, and pages captured from station sites for the recipe
# tests: text as the stations write it.
extend-exclude = ["*.tsv", "src-tauri/recipes/fixtures/"]

[default.extend-words]
# Fréquence 7, a French station (recipes/stations/frequence7.toml)
frequence = "frequence"
# Cadena SER, a Spanish network
ser = "ser"
# RTS Espace 2, a Swiss public station
espace = "espace"
