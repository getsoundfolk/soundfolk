[package]
name = "soundfolk"
description = "Soundfolk — discover and listen to web radios from around the world"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[workspace]
members = ["crates/nowplaying"]

# Shared by every crate. `version` is the app's only version: Tauri reads it for the bundles
# and the About page, the release workflow (release.yml) checks the tag against it.
[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.95"

# Lints of every crate in the workspace (each one opts in with `[lints] workspace = true`).
# The CI runs clippy with `-D warnings`: a "warn" here fails it.
[workspace.lints.rust]
# Each unsafe operation sits in its own `unsafe { }` block, even in an unsafe fn.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Every `unsafe { }` block says why it is sound, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
# Leftovers from a debugging or a draft session.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[lints]
workspace = true

[lib]
name = "soundfolk_lib"
# Desktop only needs the rlib. The mobile builds will need "staticlib" (iOS) and "cdylib" (Android)
# back, or a small mobile crate that has them: built every time, they add ~1.6 GB per debug build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Track lookup from the history: open a search page in the browser, copy a title
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# Checks the search addresses users add to the track menu (already pulled in by Tauri)
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The window's TypeScript bindings (`src/lib/bindings.ts`), generated from the commands and their
# types: `cargo test bindings` writes them. Pinned: these are release candidates.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }
# Station logos kept on disk, handed to the window inline (`data:` addresses)
base64 = "0.23"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Local database (SQLite statically compiled, no system dependency)
rusqlite = { version = "0.41", features = ["bundled"] }

# Desktop audio engine, 100% Rust
#   stream-download : HTTP network buffer (reqwest re-exported, rustls TLS)
#   symphonia       : demuxing + decoding MP3 / AAC (ADTS & MP4) / Ogg Vorbis / FLAC / WAV
#   cpal            : sound card output (ALSA by default on Linux)
#   rtrb            : lock-free SPSC ring buffer between decoder and audio callback
stream-download = { version = "0.24", default-features = false, features = ["reqwest", "reqwest-rustls"] }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm", "id3v2"] }
cpal = "0.18"
rtrb = "0.4"
# Same reqwest as stream-download's, with gzip: the shared recipe list and station pages come
# compressed. The audio client turns it off (`no_gzip`).
reqwest = { version = "0.13", default-features = false, features = ["gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
rubato = "5.0.1"
# Constant volume: ITU-R BS.1770 loudness of the stream, for a per-station gain (docs/11-loudness.md)
ebur128 = { version = "0.1.11", default-features = false }

# Track titles: accent folding for comparison keys
unicode-normalization = "0.1"
# The QR code of a share link, as SVG (docs/16-sharing.md §4.1)
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Titles of streams without metadata: recipes, server status pages, scheduling (no I/O)
soundfolk-nowplaying = { path = "crates/nowplaying" }
# HTTP `Date` headers and timestamps
jiff = { version = "0.2", default-features = false, features = ["std"] }
# Station pages in another charset than UTF-8 (Latin-1 and the like), decoded as a browser does
encoding_rs = "0.8"

# One running copy only: launching Soundfolk again brings the existing window forward
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# `soundfolk://` share links, from the page's "Open in Soundfolk" (docs/16-sharing.md §3.1)
tauri-plugin-deep-link = "2"
# Launch at login (Settings), hidden in the notification area
tauri-plugin-autostart = "2"
# Track notifications (Settings): on Linux through D-Bus with the zbus already there, no image support
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
# The update check compares the latest release with this one (already pulled in by Tauri)
semver = "1"
# Installs a new version over this one, checking its signature (docs/19-in-app-updates.md)
tauri-plugin-updater = "2.14"
# System media controls: MPRIS on Linux, through pure Rust D-Bus (zbus), no libdbus needed;
# Now Playing (MediaPlayer) on macOS; the System Media Transport Controls on Windows
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }

# Wake from sleep, for the stream to reconnect at once (already pulled in by Tauri)
[target.'cfg(windows)'.dependencies]
# and Internet access as Windows sees it, and the hidden window and thread of the media controls
windows-sys = { version = "0.61", features = [
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
] }

# Internet access as macOS sees it: the Network.framework path monitor takes a block (already
# pulled in by Tauri)
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Internet access as the desktop sees it (portal, NetworkManager); already pulled in by Tauri
zbus = "5"
# Notification area icon: StatusNotifierItem, so that a left click reaches the app (see tray.rs)
ksni = "0.3.6"
# The mini player's web view gives up its minimum height (mini.rs); already pulled in by Tauri
gtk = "0.18"
# The web views drawn without the GPU (windows.rs); already pulled in by Tauri
webkit2gtk = "2"
# Stops WebKit's network process and trims the heap once no window is left (memory.rs); already
# pulled in by Tauri
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
# Writes the TypeScript bindings (`cargo test bindings`), with tauri-specta's exporter
specta-typescript = "=0.0.13"

# Dependencies (Tauri, GTK, WebKit…) without debug info: smaller and faster debug builds. Our own crates
# keep it in full; panics and backtraces still name the dependencies' functions. To step into a
# dependency with a debugger, build once with: --config 'profile.dev.package."*".debug=true'
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
