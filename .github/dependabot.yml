# SPDX-License-Identifier: MPL-2.0
#
# Weekly update PRs for the Rust crates, the npm packages and the GitHub Actions.
# Security fixes come as soon as an advisory is published, outside this schedule, once
# "Dependabot security updates" is on in the repository settings (Settings → Code security).
# The DCO check skips Dependabot's commits (bot account, see .github/scripts/check-dco.sh).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri # the workspace root, also covers crates/nowplaying
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Held back on purpose: a newer version would put a second copy of a big crate in the tree
    # (cargo-deny fails it, see src-tauri/deny.toml). Remove an entry once its reason is gone.
    ignore:
      # 0.28+ is on html5ever 0.40: a second HTML engine next to wry's dom_query 0.28
      # (html5ever 0.39). Lift once wry is on dom_query 0.29.
      - dependency-name: scraper
        versions: [">=0.28"]
      # zbus 6 would sit next to zbus 5, which souvlaki, ksni and the Tauri plugins
      # (opener, single-instance) still use. Lift once they are all on zbus 6.
      - dependency-name: zbus
        versions: [">=6"]
    groups:
      # Tauri, its plugins and its build crates move together.
      tauri:
        patterns: ["tauri", "tauri-*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions of the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
