# SPDX-License-Identifier: MPL-2.0
#
# The checks of CONTRIBUTING.md, on every pull request and every push to main:
#   - Rust: formatting (cargo fmt), lints (clippy, warnings fail), tests, unused dependencies;
#   - front end: formatting (Prettier), lints (ESLint), types (svelte-check), build;
#   - repository: spelling (typos), SPDX lines, workflows (actionlint, zizmor).
# Dependencies (advisories, licenses, duplicates) are checked by deps.yml, the DCO by dco.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    # The runner the .deb is built on (deb.yml): same system libraries.
    runs-on: ubuntu-22.04
    steps:
      # Pinned to commit SHAs rather than mutable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      # tauri::generate_context! embeds the front end: an empty dist/ is enough to compile.
      - name: Placeholder front end
        run: mkdir -p dist

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace --all-features --locked

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-machete

      - name: Unused dependencies
        working-directory: src-tauri
        run: cargo machete

  front:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lints
        run: npm run lint

      - name: Types
        run: npm run check

      - name: Build
        run: npm run build

  repository:
    name: Spelling, licenses, workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spelling
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

      - name: SPDX lines
        run: .github/scripts/check-spdx.sh

      # install-action has no actionlint manifest, and actionlint is no crate
      # for its cargo-binstall fallback: the release archive, checksum pinned.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Workflows (actionlint)
        run: actionlint

      - name: Workflows (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Findings in the job log, no upload to GitHub code scanning.
          advanced-security: false
