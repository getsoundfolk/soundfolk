# SPDX-License-Identifier: MPL-2.0
#
# Builds the Debian package (.deb) of the desktop app:
#   - every night from main, published to the rolling "nightly" pre-release
#     (skipped when main hasn't moved since the last nightly);
#   - on every `v*` tag, published to the GitHub Release of that tag.
# Each .deb gets a signed build provenance attestation
# (check it with `gh attestation verify <file>.deb -R getsoundfolk/soundfolk`).
name: Debian package

on:
  schedule:
    - cron: "17 3 * * *" # every night, 03:17 UTC
  push:
    tags: ["v*"]
  workflow_dispatch: # manual run: builds a nightly even if main hasn't moved

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deb:
    name: Build .deb
    # The oldest supported runner: the .deb links against its glibc and WebKitGTK,
    # so building here keeps it installable on Ubuntu 22.04+ and Debian 12+.
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the release and upload the .deb
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      # Pinned to commit SHAs rather than mutable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}

      - name: Decide the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$base" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match version $base in src-tauri/tauri.conf.json"
              exit 1
            fi
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "release=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            sha=$(git rev-parse HEAD)
            last=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)
            if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$last" = "$sha" ]; then
              echo "main hasn't moved since the last nightly ($sha): nothing to build"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # `+` sorts after the release in both semver and dpkg: 0.1.0 < 0.1.0+nightly.… < 0.2.0
            echo "version=$base+nightly.$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
            echo "release=nightly" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system libraries
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.version.outputs.skip != 'true'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.version.outputs.skip != 'true'
        with:
          workspaces: src-tauri

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run tauri -- build --bundles deb --config "{\"version\": \"$VERSION\"}"
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb out/
          ls -l out
          dpkg-deb --info out/*.deb

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.skip != 'true'
        with:
          subject-path: out/*.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.skip != 'true'
        with:
          name: soundfolk-deb-${{ steps.version.outputs.version }}
          path: out/*.deb
          if-no-files-found: error

      - name: Publish the tagged release
        if: steps.version.outputs.skip != 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.release }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/*.deb --clobber
          else
            gh release create "$TAG" out/*.deb --verify-tag --generate-notes --title "Soundfolk $TAG"
          fi

      - name: Publish the nightly pre-release
        if: steps.version.outputs.skip != 'true' && github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # One rolling pre-release: drop the previous one and its tag, recreate at this commit.
          gh release delete nightly --cleanup-tag --yes 2> /dev/null || true
          gh release create nightly out/*.deb \
            --prerelease --target "$(git rev-parse HEAD)" \
            --title "Nightly $VERSION" \
            --notes "Automatic build of main at $(git rev-parse --short HEAD). Not a stable release."
