# SPDX-License-Identifier: MPL-2.0
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Read-only token: this job only inspects commit messages.
permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA (v7.0.1) rather than a mutable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # the check needs the commits between the base and the head

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
