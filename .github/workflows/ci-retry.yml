# SPDX-License-Identifier: MPL-2.0
#
# Re-runs a CI run whose jobs failed only because no hosted runner picked them up (macOS arm64 in
# runs 42651821949 and 43246302663), at most twice. The rules are in .github/scripts/ci-retry.sh,
# which can be tried on a past run: ci-retry.sh getsoundfolk/soundfolk RUN_ID 1 --dry-run
name: CI retry

on:
  # Runs the copy of this file on main, with a token that can re-run jobs. Safe here: the job checks
  # out main, not the triggering run's code, and reads only job metadata from the API, no artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  retry:
    name: Re-run jobs no runner picked up
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # Only the script is checked out: nothing from the run that triggered this one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/ci-retry.sh
          sparse-checkout-cone-mode: false

      - name: Re-run if no runner was acquired
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: .github/scripts/ci-retry.sh "$REPO" "$RUN_ID" "$ATTEMPT"
